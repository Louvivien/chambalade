# Configuration Cloudflare Pages (étape 8). Le site statique est dans dist/, les fonctions dans functions/.
name = "chambalade"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "chambalade"
# Identifiant de test : il ne sert qu’au mode local (--local), qui ne contacte pas Cloudflare.
# AVANT LA MISE EN LIGNE : le remplacer par l’identifiant de la vraie base créée sur Cloudflare
# (docs/deploiement.md, étape 3). Ce n’est pas un secret. `npm run deploiement:verifier` le contrôle.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Variables non secrètes : aucune. Les secrets (TURNSTILE_SECRET, RATE_LIMIT_SALT, ACCESS_*, ADMIN_EMAILS)
# se règlent dans Cloudflare, jamais ici ; en local, voir .dev.vars.example.
