# Source tarifaire unique. Montants en centimes, issus de docs/brief.md et docs/reservation.md.
# Étape 5 : présentation des tarifs. Étape 7 : unités réservables, règles de séjour, délais.
# Toute valeur TODO(amaelle) reste null : le code ne la remplace jamais par une valeur inventée.
currency: EUR
capacity: 12
timezone: Europe/Paris

# Unités réservables (docs/reservation.md, section 3). Une nuit = date d’arrivée incluse,
# date de départ exclue.
units:
  chambre_privee:
    type: chambre
    label: Chambre avec salle de bain privée
    capacity_people: 2
    price: chambre_privee
  chambre_2:
    type: chambre
    label: Chambre 2
    capacity_people: 2
    price: chambre_partagee
  chambre_3:
    type: chambre
    label: Chambre 3
    capacity_people: 2
    price: chambre_partagee
  dortoir:
    type: dortoir
    label: Dortoir
    capacity_beds: 6
    privatisable: null # TODO(amaelle): le dortoir est-il privatisable en entier, et à quel prix ?
  paddocks:
    type: paddock
    label: Paddocks
    capacity_horses: null # TODO(amaelle): nombre de chevaux accueillis en même temps.

# Contraintes de séjour. Les valeurs 1 et 14 sont les défauts du cahier des charges.
stay:
  first_night: null # TODO(amaelle): première nuit réservable (ouverture au printemps 2027), AAAA-MM-JJ.
  min_nights: 1 # TODO(amaelle): confirmer la durée minimale.
  max_nights: 14
  last_booking_days_before: 1
  max_advance_months: 12

# Durée pendant laquelle une demande bloque les dates.
holds:
  pending_hours: 48
  accepted_days: 7

# Règles de calcul du devis. Null = inconnu : la ligne concernée est « à confirmer ».
quote:
  room_pricing: null # TODO(amaelle): per_room_night ou per_person_night.
  sheets_pricing: null # TODO(amaelle): per_bed_stay ou per_bed_night.
  rider_package_enabled: false # TODO(amaelle): contenu du forfait ; exclu du devis tant que false.
  deposit_percent: null # TODO(amaelle): pourcentage d’acompte (proposition : 30).
  children_accepted: null # TODO(amaelle): enfants acceptés ? tarif ?
# TODO(amaelle): valider l’ensemble des tarifs proposés avant publication.
prices:
  dortoir:
    amount_cents: 3500
    unit: person_night
    validated: false
  draps_dortoir:
    amount_cents: 500
    unit: null # TODO(amaelle): par lit et par séjour ou par nuit ?
    validated: false
  chambre_partagee:
    amount_cents: 7500
    unit: null # TODO(amaelle): par chambre ou par personne et par nuit ; prix en occupation seule ?
    validated: false
  chambre_privee:
    amount_cents: 8000
    unit: null # TODO(amaelle): par chambre ou par personne et par nuit ; prix en occupation seule ?
    validated: false
  petit_dejeuner:
    amount_cents: 0
    unit: included
    validated: false
  dejeuner:
    amount_cents: 1500
    unit: person_day
    validated: false
  diner:
    amount_cents: 2000
    unit: person_evening
    validated: false
  cheval:
    amount_cents: 1000
    unit: horse_night
    validated: false
  forfait_cavalier:
    amount_cents: 7000
    unit: null # TODO(amaelle): définir le contenu exact ; forfait exclu du futur devis tant qu’il reste indéfini.
    validated: false
  taxe_sejour:
    amount_cents: null # TODO(amaelle): montant par adulte et par nuit ; ne pas assimiler une valeur absente à zéro.
    unit: adult_night
    validated: false

# Paramètres de l’API (étape 8).
api:
  rate_limit_per_hour: 5 # demandes envoyées par adresse IP et par heure
  availability_max_days: 62 # fenêtre maximale d’une requête de disponibilités
  expiry_alert_hours: 12 # une demande en attente qui expire dans moins de ce délai est signalée à Amaëlle
